[package]
name = "harness-master"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The document and PDF helpers answer a confinement probe when asked by
# environment (tests/helper_confinement.rs); off in every shipped build.
helper-probe = []

[dependencies]
anyhow.workspace = true
harness-agent-native.workspace = true
argon2.workspace = true
axum.workspace = true
futures.workspace = true
getrandom.workspace = true
harness-agents.workspace = true
harness-attached.workspace = true
harness-docs.workspace = true
harness-core.workspace = true
harness-node.workspace = true
harness-protocol.workspace = true
harness-store.workspace = true
harness-tools.workspace = true
# Custom connectors (X.35, PLAN.md T84): the master speaks MCP to a remote
# server over streamable HTTP through rmcp's transport, with its own HTTP
# client (`connectors::client`): only `sse-stream` is new to the tree.
rmcp = { workspace = true, features = ["transport-streamable-http-client"] }
sse-stream.workspace = true
bytes.workspace = true
harness-web.workspace = true
harness-memory.workspace = true
harness-link.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
croner.workspace = true
infer.workspace = true
nix.workspace = true
unicode-segmentation.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-util.workspace = true
hex.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jiff.workspace = true
reqwest.workspace = true
mime_guess.workspace = true
# Gzip for the web UI's text files (assets.rs).
flate2.workspace = true
# PDF text for attachments (MIT). Runs only in the `pdf-text` helper process
# (src/pdf.rs, FIX_PLAN 3.4), never inside the server.
pdf-extract = "0.12.1"
# XML pull parser for Word, Excel, PowerPoint and OpenDocument files (MIT,
# no dependencies of its own that we do not already have). Runs only in the
# `doc-text` helper process (src/doc.rs, X.55, T96), never inside the server.
quick-xml = "=0.42.0"
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
harness-attached = { workspace = true, features = ["testkit"] }
# The tests build turn messages with `PromptMsg::test` and friends.
harness-protocol = { workspace = true, features = ["test-support"] }
# The fake MCP server of tests/logs/custom_connectors_http.rs speaks TLS (the
# link's crate, already in the tree).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
axum = { workspace = true, features = ["multipart"] }
# Breaks a table under a running master (tests/it/plugins_http.rs: settings
# that cannot be read fail closed); already the store's dependency.
rusqlite.workspace = true
# `Store::count_statements`: a request's statements, constant in the data
# (FIX_PLAN 4.5 slice 4).
harness-store = { workspace = true, features = ["test-support"] }
harness-link.workspace = true
async-trait.workspace = true
harness-agent-native.workspace = true
harness-agents.workspace = true
harness-tools.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
# Captures log output in tests/logs/temp_passwords_http.rs (already a workspace dependency).
tracing-subscriber.workspace = true
