[package]
name = "harness-provision"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
harness-core.workspace = true
# No `rsa`: the rsa crate has RUSTSEC-2023-0071 (timing side channel, unfixed).
russh = { version = "0.65.0", default-features = false, features = ["aws-lc-rs", "flate2"] }
getrandom.workspace = true
aws-lc-rs = "1.19.0"
base64 = "0.22.1"
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[features]
test-util = ["dep:tempfile"]

[dev-dependencies]
harness-provision = { path = ".", features = ["test-util"] }
tempfile.workspace = true

[[example]]
name = "fake_sshd"
required-features = ["test-util"]
