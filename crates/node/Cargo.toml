[package]
name = "harness-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex.workspace = true
sha2.workspace = true
async-trait.workspace = true
base64.workspace = true
dirs.workspace = true
flate2.workspace = true
getrandom.workspace = true
harness-core.workspace = true
harness-protocol.workspace = true
harness-store.workspace = true
harness-tools.workspace = true
jiff.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
walkdir.workspace = true

[dev-dependencies]
# The tests build turn messages with `PromptMsg::test` and friends.
harness-protocol = { workspace = true, features = ["test-support"] }
harness-agent-native.workspace = true
# The built-in agents' definitions in `tests/personal_subagents.rs` (X.31).
harness-agents.workspace = true
# A real document to point the preview at, in `tests/folder_preview.rs`.
harness-docs.workspace = true
# The real link under the node in `tests/control_over_link.rs` (A.21).
harness-link.workspace = true
# `recall`, the tool, in `tests/recall.rs`.
harness-memory.workspace = true
# The real web tools on a node, in `tests/web_tools.rs` (T.3).
harness-web.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
# Log lines at TRACE searched for a token in `forge_clone` tests (T86).
tracing-subscriber.workspace = true

[features]
# The test hooks `crates/cli`'s sandbox tests drive (`testing`); never in
# the shipped binary (resolver 3 enables a dev-dependency's features only
# for the targets that need them).
testing = []
