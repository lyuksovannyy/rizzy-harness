# Full: the harness, Redis, MariaDB, and Qdrant for memory vectors, with
# Ollama computing the embeddings (no key, nothing leaves the host).
#   cp .env.example .env            # set the passwords
#   mkdir -p data && sudo chown 10001:10001 data
#   docker compose up -d            # the first start pulls the embeddings model
#   docker compose exec harness rizzy-harness claim-code
#
# MariaDB is behind the `mariadb` profile until the harness can use it (see
# ../standard/compose.yaml).
name: rizzy-harness-full

services:
  harness:
    image: ghcr.io/lyuksovannyy/rizzy-harness:${HARNESS_TAG:-latest}
    # build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      HARNESS_DATA_DIR: /data
      HARNESS_KV_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      HARNESS_MEMORY_BACKEND: qdrant
      HARNESS_MEMORY_RECALL: meaning
      HARNESS_QDRANT_URL: http://qdrant:6333
      HARNESS_QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      HARNESS_EMBEDDINGS_SOURCE: ollama
      HARNESS_EMBEDDINGS_URL: http://ollama:11434/v1
      HARNESS_EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-nomic-embed-text}
      # Services on this private network have no certificates.
      HARNESS_PLAIN_HTTP_HOSTS: qdrant,ollama
    command: ["serve", "--bind", "0.0.0.0:7777"]
    ports: ["127.0.0.1:${HARNESS_PORT:-7777}:7777"]
    volumes:
      - ${HARNESS_DATA_PATH:-./data}:/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama-model:
        condition: service_completed_successfully
    networks: [harness]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    networks: [harness]

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage
    networks: [harness]

  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [harness]
    # GPU: see https://hub.docker.com/r/ollama/ollama (deploy.resources).

  # One-shot: make sure the embeddings model is there before the harness starts.
  ollama-model:
    image: ollama/ollama:0.12.6
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${EMBEDDINGS_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$$MODEL\""]
    restart: "no"
    networks: [harness]

  mariadb:
    profiles: [mariadb]
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-harness}
      MARIADB_USER: ${MARIADB_USER:-harness}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mariadb:/var/lib/mysql
    networks: [harness]

volumes:
  redis:
  qdrant:
  ollama:
  mariadb:

networks:
  harness:
