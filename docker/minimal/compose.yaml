# Minimal: the harness alone. SQLite and the key-value store (logins) live
# in the data directory; nothing else to run.
#   cp .env.example .env            # then edit it
#   mkdir -p data && sudo chown 10001:10001 data   # the image runs as uid 10001
#   docker compose up -d
#   docker compose exec harness rizzy-harness claim-code
# Open http://127.0.0.1:7777 (or tunnel: ssh -L 7777:127.0.0.1:7777 host).
name: rizzy-harness-minimal

services:
  harness:
    image: ghcr.io/lyuksovannyy/rizzy-harness:${HARNESS_TAG:-latest}
    # Or build this checkout: uncomment, then `docker compose up -d --build`.
    # build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      HARNESS_DATA_DIR: /data
    command: ["serve", "--bind", "0.0.0.0:7777"]
    # Loopback only: put a reverse proxy or a tunnel in front for others.
    ports: ["127.0.0.1:${HARNESS_PORT:-7777}:7777"]
    volumes:
      - ${HARNESS_DATA_PATH:-./data}:/data
