# Standard: the harness, Redis (logins shared by every harness process,
# kept across restarts) and MariaDB.
#   cp .env.example .env            # set the passwords
#   mkdir -p data && sudo chown 10001:10001 data
#   docker compose up -d
#   docker compose exec harness rizzy-harness claim-code
#
# MariaDB: the harness cannot use it yet (its storage still runs on SQLite;
# see docs/storage-backends.md). The service is behind the `mariadb` profile
# so it does not run idle: `docker compose --profile mariadb up -d` once
# HARNESS_DATABASE_URL may point at it.
name: rizzy-harness-standard

services:
  harness:
    image: ghcr.io/lyuksovannyy/rizzy-harness:${HARNESS_TAG:-latest}
    # build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      HARNESS_DATA_DIR: /data
      HARNESS_KV_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    command: ["serve", "--bind", "0.0.0.0:7777"]
    ports: ["127.0.0.1:${HARNESS_PORT:-7777}:7777"]
    volumes:
      - ${HARNESS_DATA_PATH:-./data}:/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [harness]

  redis:
    # Valkey (valkey/valkey:8-alpine) is a drop-in replacement.
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    # No published port: only the harness reaches it.
    networks: [harness]

  mariadb:
    profiles: [mariadb]
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-harness}
      MARIADB_USER: ${MARIADB_USER:-harness}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mariadb:/var/lib/mysql
    networks: [harness]

volumes:
  redis:
  mariadb:

networks:
  harness:
