# cargo-deny: licences, advisories, bans, sources. Run: cargo deny check

[graph]
all-features = false

[advisories]
# RustSec advisory DB; unmaintained crates are reported for workspace deps.
unmaintained = "workspace"
ignore = [
    # ttf-parser is unmaintained; it arrives through pdf-extract → lopdf and
    # parses fonts embedded in untrusted PDFs. Accepted because that code
    # runs only in the `pdf-text` helper process: Landlock with no file and
    # no TCP access, an address-space limit, a 20 s kill, an empty
    # environment (FIX_PLAN 3.4, AUDIT S7, PLAN.md T20). Revisit when
    # pdf-extract or lopdf drop it.
    { id = "RUSTSEC-2026-0192", reason = "FIX_PLAN 3.4: only in the confined pdf-text helper" },
    # rmcp before 3.9.0 buffers a Streamable HTTP response body without a
    # limit. That code is behind the features
    # `transport-streamable-http-client*`, which this workspace does not
    # enable: rmcp is built with `default-features = false` and only
    # `client` and `transport-async-rw` (stdio servers; see Cargo.toml), and
    # our own reader caps a stdio line at 8 MiB. 3.9.0 was under two weeks
    # old when the MCP client was added (CLAUDE.md's dependency rule), so
    # the pin stays at 3.8.0 for now. Remove this entry by moving the pin
    # to 3.9.0 or newer once it is two weeks old, and in any case BEFORE an
    # HTTP transport feature is turned on (ADOPTION_PLAN X.3 follow-up).
    { id = "RUSTSEC-2026-0462", reason = "X.3: the affected HTTP client features are not compiled in" },
]

[licenses]
# Permissive licences only. Anything else (incl. AGPL/GPL) fails CI.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# MPL-2.0 is file-level copyleft: obligations apply only if we modify the
# crate's own files, which we do not. Allowed for this one crate only, so any
# new MPL dependency is still reviewed.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# Servo's CSS parser, used unmodified through dom_smoothie (web_fetch
# readability). Same reasoning as above.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
