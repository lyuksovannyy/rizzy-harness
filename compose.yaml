# Central server in Docker. Read README → "Central server in Docker" first.
#   mkdir -p data && sudo chown 10001:10001 data   # the image runs as uid 10001
#   docker compose up -d                      # pulls ghcr.io/lyuksovannyy/rizzy-harness
#   docker compose exec rizzy-harness rizzy-harness claim-code
# then open http://127.0.0.1:7777 (or tunnel to it: ssh -L 7777:127.0.0.1:7777).
services:
  rizzy-harness:
    # Published images: :latest (newest release), :X.Y.Z, :edge (main, after CI).
    image: ghcr.io/lyuksovannyy/rizzy-harness:${HARNESS_TAG:-latest}
    # Or build this checkout instead: uncomment, then `docker compose up -d --build`.
    # build: .
    restart: unless-stopped
    # Host networking: the master reaches nodes through the host's WireGuard
    # interface and binds to loopback / the tunnel address like on bare metal.
    # (0.0.0.0 is refused with host networking.)
    network_mode: host
    command: ["serve", "--bind", "127.0.0.1:7777"]
    # Accept remote nodes on the host's VPN address (README → "Set up a node by hand"):
    # command: ["serve", "--bind", "127.0.0.1:7777", "--node-listen", "10.77.0.1:7443"]
    volumes:
      - ./data:/data

  # UI only, no remote nodes, isolated network: publish on loopback only.
  # rizzy-harness:
  #   image: ghcr.io/lyuksovannyy/rizzy-harness:latest
  #   restart: unless-stopped
  #   ports: ["127.0.0.1:7777:7777"]
  #   volumes: ["./data:/data"]
