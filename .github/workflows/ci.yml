name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t harness:ci .
      - name: smoke test (UI answers, container bind rules)
        run: |
          docker run -d --name harness-ci -p 127.0.0.1:7777:7777 harness:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:7777/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:7777/ | grep -q '<div id="root">'
          docker exec harness-ci harness claim-code > /dev/null  # exists; not printed
          # Host networking with 0.0.0.0 must be refused.
          docker run --rm --network host harness:ci 2>&1 | grep "shares the host's network"
