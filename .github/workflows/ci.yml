name: ci
# Pushes to main and release tags, and every pull request: a pull-request
# commit runs once, not twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer commit on a pull request replaces the run of the one before it:
# without this every push queued a full run, and on a day with six pull
# requests open the runs for commits already replaced held the runners.
# Runs on main and on tags are never cancelled: each of those publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting and lints, once for the whole workspace.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          # Pull requests read main's cache and write none of their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The tests, in parallel groups. Run in one job they took 26 to 37
  # minutes, nearly all of it the tests themselves (measured on main,
  # 2026-11-20: the CLI crate 503 s, the master 431 s, the node 315 s and
  # again 328 s as it ships, everything else about 190 s), so each of the
  # long ones gets a runner of its own. Together the groups run exactly what
  # `cargo test --workspace` and `cargo test -p harness-node` ran.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CLI's dev-dependency turns on harness-node's `testing` hooks,
          # as it did for the whole workspace build.
          - name: cli
            run: cargo test -p harness
          - name: master
            run: cargo test -p harness-master
          # The node with the `testing` hooks, as the workspace build had it.
          - name: node
            run: cargo test -p harness-node --features testing
          # The node as it ships: its own suite once more without the hooks
          # (plan mode, approvals, the node's policy), so a difference
          # between the two cannot hide.
          - name: node-shipped
            run: cargo test -p harness-node
          - name: rest
            run: cargo test --workspace --exclude harness --exclude harness-master --exclude harness-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The shell's containment (T.8a) needs bubblewrap and unprivileged
      # user namespaces; Ubuntu 24.04 and later deny those through AppArmor
      # unless this sysctl is 0. The last line proves the form the node
      # uses works before the tests that need it run. fuse3 (the setuid
      # fusermount3) lets T.8e's test hold a read the kernel cannot
      # interrupt.
      - name: bubblewrap for the containment tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap fuse3
          test -c /dev/fuse
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --die-with-parent --new-session --unshare-pid --dev-bind / / --proc /proc -- true
      - run: ${{ matrix.run }}
        env:
          # A containment test that cannot run fails instead of skipping.
          HARNESS_REQUIRE_BWRAP: "1"
          HARNESS_REQUIRE_FUSE: "1"

  # The one check the branch rule and `publish` wait for. It runs whatever
  # happened above and fails unless every part passed: a job skipped because
  # one it needs failed would otherwise count as passed.
  rust:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The version web/package.json pins (packageManager).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t harness:ci .
      - name: smoke test (UI answers, container bind rules)
        run: |
          docker run -d --name harness-ci -p 127.0.0.1:7777:7777 harness:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:7777/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:7777/ | grep -q '<div id="root">'
          docker exec harness-ci rizzy-harness claim-code > /dev/null  # exists; not printed
          # Host networking with 0.0.0.0 must be refused.
          docker run --rm --network host harness:ci 2>&1 | grep "shares the host's network"

  # Publish only what passed every job above: main → :edge, tag vX.Y.Z →
  # :X.Y.Z, :X.Y, :latest and a GitHub Release with the binary.
  publish:
    needs: [rust, deny, web, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub Release
      packages: write   # ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml $v"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=rizzy-harness
            org.opencontainers.image.description=Self-hosted coding-agent harness: central server (web UI, chats, node setup). Nodes run on real hosts, not in containers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub Release with the binary
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          img=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}
          docker pull "$img"
          id=$(docker create "$img")
          docker cp "$id:/usr/local/bin/rizzy-harness" rizzy-harness
          docker rm "$id"
          name=rizzy-harness-$GITHUB_REF_NAME-x86_64-linux-gnu
          tar czf "$name.tar.gz" rizzy-harness README.md LICENSE
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release create "$GITHUB_REF_NAME" "$name.tar.gz" "$name.tar.gz.sha256" \
            --title "rizzy-harness $GITHUB_REF_NAME" --generate-notes \
            --notes "Docker: \`docker pull $img\`. The binary is built on Debian 13 (glibc 2.41)."
