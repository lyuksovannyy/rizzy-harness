[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/lyuksovannyy/rizzy-harness"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
harness-core = { path = "crates/core" }
harness-store = { path = "crates/store" }
harness-protocol = { path = "crates/protocol" }
harness-tools = { path = "crates/tools" }
harness-codemap = { path = "crates/codemap" }
harness-agent-native = { path = "crates/agent-native" }
harness-agents = { path = "crates/agents" }
harness-node = { path = "crates/node" }
harness-master = { path = "crates/master" }
harness-web = { path = "crates/web" }
harness-memory = { path = "crates/memory" }
harness-link = { path = "crates/link" }

anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
# AES-256-GCM for the blob store (docs: sidebar areas §5.1); already linked
# through rustls, so no second crypto library.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.9", features = ["ws"] }
# File chunks in protocol messages (artifact transfer, chat images).
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
# Routine schedules: 5-field cron evaluated in jiff time zones (no chrono).
croner = { version = "4.0.2", default-features = false, features = ["jiff"] }
dirs = "7.0.0"
# `.env` next to the binary or in the working directory (Docker templates).
dotenvy = "0.15.7"
# Gzip for folders a node packs into one artifact.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures = "0.3.34"
# Pinned exactly: single maintainer; kept behind harness_agent_native::Provider.
genai = "=0.7.2"
getrandom = "0.4.3"
globset = "0.4.21"
hex = "0.4.3"
# The serve loop (master/src/serve.rs): header-read timeout, connection cap.
# Both are already in the tree through axum and reqwest; HTTP/1 only, like
# axum::serve with its default features.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "service"] }
ignore = "0.4.34"
# Magic-byte sniffing of stored files; no OLE parsing (std/cfb), only the
# first 8 KiB is read.
infer = { version = "0.22.0", default-features = false }
# Bundled tz database: containers often lack /usr/share/zoneinfo.
# The Landlock project's own crate (MIT OR Apache-2.0): the shell sandbox
# (FIX_PLAN 2.7). Pinned exactly: every ABI it adds changes what is enforced.
landlock = "=0.4.7"
jiff = { version = "0.2.39", features = ["tzdb-bundle-always"] }
mime_guess = "2.0.5"
nix = { version = "0.31.3", features = ["signal", "process", "hostname", "net", "fs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "multipart"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "=2.0.0"
sha2 = "0.11.1"
subtle = "2.6.1"
# Writes folder packs only (no unpacking anywhere); no xattrs, uid/gid are 0.
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Base letters for the secret guard (harness-core ui::secret); already in
# the tree through pdf-extract.
unicode-normalization = "0.1.26"
# Sentence and grapheme boundaries for search previews (UAX #29).
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"
strip = true

# Full debug info for ~30 test binaries filled the disk (18 GB); line tables
# keep backtraces useful at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
